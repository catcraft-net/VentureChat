<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatCraft · Chat history</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div class="eyebrow">CATCRAFT / STAFF TOOLS</div><h1>Chat history</h1><p>Search your realm’s conversations.</p><button id="logout" hidden>Lock dashboard</button></header>
<section id="login"><label for="token">Staff access token</label><div class="loginrow"><input id="token" type="password" autocomplete="off" placeholder="Paste your dashboard token"><button id="unlock">Unlock</button></div><p class="muted">The token stays in this tab’s memory and clears when you lock or reload.</p></section>
<section id="workspace" hidden><form id="search"><div class="filters"><label>Realm<input name="realm" maxlength="64" placeholder="All realms"></label><label>Channel<input name="channel" maxlength="64" placeholder="All channels"></label><label>Player<input name="player" maxlength="64" placeholder="Exact name or UUID"></label><label>Message contains<input name="text" maxlength="256" placeholder="Search text"></label><label>From<input name="from" type="datetime-local"></label><label>Until<input name="to" type="datetime-local"></label></div><button type="submit">Search messages</button></form>
<div class="resultsheading"><h2 id="resulttitle">Messages</h2><span id="health" class="muted"></span></div><p id="note" class="muted"></p><div class="tablewrap"><table><thead><tr><th>Time</th><th>Realm</th><th>Channel</th><th>Player</th><th>Message</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><nav><button id="previous">← Newer</button><span id="page"></span><button id="next">Older →</button></nav></section><p id="error" role="alert"></p><footer>History is best effort. Queue overflow and storage outages can leave gaps.</footer></main></body></html>
